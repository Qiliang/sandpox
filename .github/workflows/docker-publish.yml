name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version bump
        id: version
        run: |
          extract_version() {
            sed -n 's/^version *= *"\([^"]*\)".*/\1/p' | head -n1
          }

          NEW_VERSION=$(extract_version < pyproject.toml)
          if [ -z "$NEW_VERSION" ]; then
            echo "Failed to parse version from pyproject.toml"
            exit 1
          fi

          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            OLD_VERSION=$(git show HEAD^:pyproject.toml | extract_version || true)
          else
            OLD_VERSION=""
          fi

          echo "old_version=${OLD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

          if [ "$NEW_VERSION" = "$OLD_VERSION" ]; then
            echo "Version unchanged (${NEW_VERSION}); skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version bumped: ${OLD_VERSION:-<none>} -> ${NEW_VERSION}"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set lowercase image name
        if: steps.version.outputs.should_publish == 'true'
        run: echo "IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        if: steps.version.outputs.should_publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.version.outputs.should_publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: steps.version.outputs.should_publish == 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.new_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.new_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
